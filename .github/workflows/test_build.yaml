name: Test build Oolite packages

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    strategy:
      matrix:
        # This creates two separate jobs that run in parallel
        compiler: [clang, gcc]
        include:
          - compiler: clang
            env_msystem: UCRT64
          - compiler: gcc
            env_msystem: MINGW64

    steps:
    - name: Pre-setup ownership & curl token
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # This must run before the checkout action if the action tries to do git commands
        mkdir -p "$GITHUB_WORKSPACE"
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        echo 'header = "Authorization: Bearer '$GITHUB_TOKEN'"' >> ~/.curlrc
        echo 'header = "Accept: application/vnd.github+json"' >> ~/.curlrc

    - uses: actions/checkout@v6

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        update: true

    - name: Build Oolite
      shell: msys2 {0}
      env:
        msystem: ${{ matrix.env_msystem }}
      run: |
        ./install.sh ${{ matrix.compiler }}

    - name: Upload artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        # Uses the compiler name to keep artifact names unique
        name: oolite-build-${{ matrix.compiler }}
        path: packages/**
